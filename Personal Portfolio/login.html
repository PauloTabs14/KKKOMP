<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Paulo Tablang Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="auth-bg">
  <div class="gradient-orb orb1"></div>
  <div class="gradient-orb orb2"></div>
</div>

<button class="theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <i class="fa-solid fa-sun"></i>
</button>

<div class="auth-wrapper">
  <div class="auth-card glass-card">
    <a href="index.html" class="logo auth-logo">Paulo<span>.dev</span></a>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Login to access your dashboard</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-msg" id="passwordError"></span>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember">
          <span>Remember Me</span>
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
