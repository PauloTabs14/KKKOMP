<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | John Paul N. Tablang Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="auth-bg">
  <div class="gradient-orb orb1"></div>
  <div class="gradient-orb orb2"></div>
</div>

<button class="theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <i class="fa-solid fa-sun"></i>
</button>

<div class="auth-wrapper">
  <div class="auth-card glass-card">
    <a href="index.html" class="logo auth-logo">John Paul N. Tablang<span>.dev</span></a>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Register to access your dashboard</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
        <span class="error-msg" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Min. 6 characters" required>
          <button type="button" class="toggle-pass" data-target="password" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-msg" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
          <button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-msg" id="confirmPasswordError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa-solid fa-user-plus"></i> Register
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
